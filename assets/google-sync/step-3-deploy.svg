<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Deploy Apps Script as a web app</title>
  <desc id="desc">The web app deployment dialog with execute as me and access set to anyone.</desc>
  <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0b1220" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#e57ca0"/></marker></defs>
  <rect width="1200" height="675" rx="42" fill="#eaf0f7"/>
  <rect x="54" y="42" width="1092" height="590" rx="22" fill="#f8f9fa" filter="url(#shadow)"/>
  <rect x="54" y="42" width="1092" height="64" rx="22" fill="#fff"/>
  <text x="92" y="82" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#202124">Apps Script</text>
  <rect x="942" y="55" width="160" height="40" rx="8" fill="#1a73e8"/><text x="1022" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Deploy</text>
  <g filter="url(#shadow)">
    <rect x="280" y="120" width="640" height="465" rx="18" fill="#fff"/>
    <text x="322" y="168" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202124">New deployment</text>
    <text x="322" y="218" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5f6368">Select type</text>
    <rect x="322" y="232" width="556" height="48" rx="8" fill="#fff" stroke="#dadce0"/><text x="344" y="263" font-family="Arial,sans-serif" font-size="17" fill="#202124">Web app</text>
    <text x="322" y="324" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5f6368">Execute as</text>
    <rect x="322" y="338" width="556" height="48" rx="8" fill="#fff" stroke="#dadce0"/><text x="344" y="369" font-family="Arial,sans-serif" font-size="17" fill="#202124">Me</text>
    <text x="322" y="430" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5f6368">Who has access</text>
    <rect x="322" y="444" width="556" height="48" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="344" y="475" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#174ea6">Anyone</text>
    <rect x="745" y="518" width="133" height="44" rx="8" fill="#1a73e8"/><text x="811" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Deploy</text>
  </g>
  <circle cx="1010" cy="475" r="34" fill="#e57ca0"/><text x="1010" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">3</text>
  <path d="M972 475H884" stroke="#e57ca0" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
